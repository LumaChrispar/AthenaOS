# AthenaOS Quality Thresholds
# Used by SRV-010 (QA Director) and ProseAnalyzer

quality_thresholds:
  continuity_score_minimum: 7.0
  prose_quality_minimum: 7.0
  readability_minimum: 6.0
  originality_minimum: 6.0

# Programmatic metric thresholds (from ProseAnalyzer)
prose_metrics:
  passive_voice_rate_max: 0.15          # Max 15% passive constructions
  sentence_length_variance_min: 5.0     # Minimum sentence length variance
  repeated_phrase_score_max: 0.02       # Max 2% n-gram overlap with previous chapters
  paragraph_density_max: 150            # Max average words per paragraph
  dialogue_ratio_range: [0.2, 0.6]      # Dialogue should be 20-60% of prose
  adjective_density_max: 8.0            # Max adjectives per 100 words
  adverb_density_max: 3.0               # Max adverbs per 100 words
  opening_pattern_diversity_min: 0.3    # At least 30% unique opening patterns
  atmospheric_budget: 500               # Max 1 atmospheric descriptor per 500 words
  hedged_language_max: 3                # Max hedged emotional statements per chapter

# Chapter-level targets
chapter_targets:
  word_count_min: 2500
  word_count_max: 4000
  word_count_target: 3000

# Revision limits
revision_limits:
  max_revision_attempts: 3
  escalation_threshold: 3

# Critique checkpoints
critique_checkpoints: [3, 6, 9, 12, 15]
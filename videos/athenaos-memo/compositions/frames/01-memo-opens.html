    <script>
      (function () {
        /* ids are frame-prefixed and start with a digit, which is not a valid
           CSS ident — resolve every target by id, never by selector string. */
        function el(id) {
          var node = document.getElementById("f01-memo-opens-" + id);
          if (!node) throw new Error("missing element: " + id);
          return node;
        }

        var kwSpike = el("kw-spike");
        var kwMemo = el("kw-memo");
        var kwSubject = el("kw-subject");
        var kwFrom = el("kw-from");
        var headerRule = el("header-rule");
        var subjectRule = el("subject-rule");
        var fromRule = el("from-rule");
        var coralRule = el("coral-rule");
        var stamp = el("stamp");
        var lineA = el("line-a");
        var lineB = el("line-b");
        var railText = el("rail-text");
        var railCaret = el("rail-caret");

        var tl = gsap.timeline({ paused: true });

        /* ================= SCENE 1 — 0.0–1.4s : the memo header band alone ==== */
        /* per-word, blurred to sharp (kinetic-beat-slam entrances + DoF blur) */
        tl.fromTo(
          kwSpike,
          { opacity: 0, filter: "blur(10px)", scale: 0.94 },
          { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.4, ease: "power4.out" },0.014);
        tl.fromTo(
          kwMemo,
          { opacity: 0, filter: "blur(10px)", scale: 0.94 },
          { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.4, ease: "power4.out" },0.055);

        /* the hairline rule draws on beneath the kicker */
        tl.fromTo(
          headerRule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.7, ease: "power2.inOut" },0.206);

        /* the empty SUBJECT: / FROM: label pair */
        tl.fromTo(
          kwSubject,
          { opacity: 0, filter: "blur(8px)", y: 14 },
          { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.4, ease: "expo.out" },0.379);
        tl.fromTo(
          subjectRule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.55, ease: "power2.inOut" },0.427);
        tl.fromTo(
          kwFrom,
          { opacity: 0, filter: "blur(8px)", y: 14 },
          { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.4, ease: "expo.out" },0.592);
        tl.fromTo(
          fromRule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.55, ease: "power2.inOut" },0.654);

        /* ================= SCENE 2 — 1.4–2.8s : the stamp drops, the rule draws === */
        /* a hard settle with a small scale overshoot that damps immediately */
        tl.fromTo(
          stamp,
          { opacity: 0, scale: 1.22, y: -34 },
          { opacity: 1, scale: 1, y: 0, duration: 0.26, ease: "power4.out" },0.998);
        tl.to(stamp, { scale: 0.988, duration: 0.07, ease: "power2.out" },1.178);
        tl.to(stamp, { scale: 1, duration: 0.16, ease: "power2.inOut" },1.225);

        /* the coral rule draws left-to-right beneath the header */
        tl.fromTo(
          coralRule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.72, ease: "power2.inOut" },1.343);

        /* ================= SCENE 3 — 2.8–6.0s : the statement sets in ============ */
        /* state A — slam in at display scale, centered */
        tl.fromTo(
          lineA,
          { opacity: 0, filter: "blur(16px)", scale: 1.06 },
          { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.52, ease: "power4.out" },1.941);

        /* state B is collapsed at build time so every seek is correct; it stays
           invisible until the hard cut — the blueprint's in-place token swap */
        gsap.set(lineB, { opacity: 0, scale: 1.055 });

        /* the in-place token swap — an instant hard cut, then one settling pop */
        tl.set(lineA, { opacity: 0 },2.699);
        tl.set(lineB, { opacity: 1 },2.699);
        tl.fromTo(lineB, { scale: 1.055 }, { scale: 1, duration: 0.34, ease: "power3.out" },2.699);

        /* the mono service rail types on beneath the statement.
           ONE full-duration clock drives both the typed text and the caret, so
           there is exactly one writer per property — a direct style write that
           fights a later gsap.set never lands, and the hold must stay still. */
        var RAIL_FULL = "SRV-001 \u2192 SRV-030";
        var TEXT_AT = 4.3;
        var TEXT_DUR = 1.0;
        var TEXT_END = TEXT_AT + TEXT_DUR; /* 5.3 — the still hold begins */
        var SHOT_END = 6.0;
        var BLINK_CYCLES = 2.5; /* one cycle per 0.4s across the typing window */

        var clock = { t: 0 };
        gsap.set(railCaret, { opacity: 0 });
        gsap.set(railText, { text: "" });

        tl.to(
          clock,
          {
            t: SHOT_END,
            duration: SHOT_END,
            ease: "none",
            onUpdate: function () {
              var t = clock.t;
              var chars = 0;
              if (t >= TEXT_AT) {
                var p = Math.min(1, (t - TEXT_AT) / TEXT_DUR);
                chars = Math.floor(RAIL_FULL.length * p);
              }
              railText.textContent = RAIL_FULL.substring(0, chars);

              var caretOn = 0;
              if (t >= TEXT_AT && t < TEXT_END) {
                var phase = ((t - TEXT_AT) / TEXT_DUR) * Math.PI * 2 * BLINK_CYCLES;
                caretOn = Math.sin(phase) > 0 ? 1 : 0;
              }
              railCaret.style.opacity = caretOn ? "1" : "0";
            },
          },0);

        window.__timelines = window.__timelines || {};
        window.__timelines["01-memo-opens"] = tl;
      })();

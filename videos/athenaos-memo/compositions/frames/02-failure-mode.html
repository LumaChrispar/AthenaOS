<template>
  <style>
    /* ---- Code editorial · frame 02-failure-mode ----
       Ground: cream paper. Content gathers on a tile half-step.
       Coral = ONE voltage moment (the right-margin index mark).
       Root is styled by #root, never by a class (lint: subcomposition_root_styled_by_class). */

    @font-face {
      font-family: "EB Garamond";
      src: url("assets/fonts/EBGaramond.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "EB Garamond";
      src: url("assets/fonts/EBGaramond.woff2") format("woff2");
      font-weight: 400;
      font-style: italic;

    }
    @font-face {

      src: url("assets/fonts/Inter.woff2") format("woff2");

    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/fonts/JetBrainsMono.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;

    }
    @font-face {

    #root {

    /* ---- layer 1 · full-bleed ground (rides on a clip, never on #root) ---- */
    #f02-ground {
      position: absolute;
      inset: 0;
      background: #faf9f5;
    }

    /* ---- memo chrome strip above the field band (cream ground) ---- */
    #f02-chrome {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 88px;
    }
    #f02-chrome-l,
    #f02-chrome-r {
      position: absolute;

    #f02-chrome-l { left: 80px; }

    /* ---- layer 2 · the memo field band (tile half-step), scrolls into place ---- */
    #f02-field {
      position: absolute;
      left: 0;

      height: 792px;

    #f02-band {
      position: absolute;

    #f02-band-top,

    /* ---- layer 3 · type on the band ---- */
    #f02-kicker {

    #f02-spike {

    /* solid redaction bar, sitting over an unseen line */
    #f02-redaction {
      position: absolute;
      left: 80px;

      border: 1px solid rgba(20, 20, 19, 0.08);

    #f02-caret-bar {
      position: absolute;

    /* typewriter line (JetBrains Mono, code voice) */
    #f02-type-line {

    #f02-type-wrap {

    #f02-type-text { white-space: pre; }
    #f02-caret-type {
      display: inline-block;
      width: 10px;
      height: 30px;
      margin-left: 4px;
      background: #141413;
      vertical-align: -4px;
    }

    /* right-margin rail + the single coral index mark */
    #f02-rail {
      position: absolute;
      left: 1820px;
      top: 138px;
      width: 1px;
      height: 420px;
      background: rgba(20, 20, 19, 0.14);
    }
    #f02-rail-idx {
      position: absolute;
      left: 1819px;
      top: 292px;
      width: 3px;
      height: 46px;
      background: #cc785c; /* the ONE coral moment in this frame */
      border-radius: 1px;
    }

    /* hero · EB Garamond display-italic, left-aligned on the rule-of-thirds line */
    #f02-hero-line {
      position: absolute;
      left: 640px;
      top: 378px;
      display: flex;
      align-items: baseline;
      font-family: "EB Garamond", Georgia, serif;
      font-weight: 400;
      font-style: italic;
      font-size: 6.7cqw; /* 128.6px */
      line-height: 1.05;
      letter-spacing: -0.012em;
      color: #141413;
      white-space: pre;
    }
    #f02-hero-wrap {
      display: inline-flex;
      align-items: baseline;
      min-width: 540px;
      white-space: pre;
    }
    #f02-hero-text { white-space: pre; }
    #f02-caret-hero {
      display: inline-block;
      width: 11px;
      height: 108px;
      margin-left: 8px;
      background: #141413;
      vertical-align: -10px;
    }

    /* the hairline rule that stops mid-stroke */
    #f02-rule-svg {
      position: absolute;
      left: 640px;
      top: 566px;
      width: 1180px;
      height: 1px;
      overflow: visible;
    }
    #f02-rule-line {
      fill: none;
      stroke: rgba(20, 20, 19, 0.2);
      stroke-width: 1;
      stroke-linecap: butt;
    }
  </style>

  <div
    id="root"
    data-composition-id="02-failure-mode"
    data-width="1920"
    data-height="1080" data-duration="5.24"
  >
    <!-- depth layer 1 · full-bleed cream ground, full-duration clip -->
    <div
      class="clip"
      id="f02-ground"
      data-start="0"
      data-duration="7"
      data-track-index="0"
    ></div>

    <!-- depth layer 2/3 · memo chrome + field band + type -->
    <div id="f02-chrome">
      <div id="f02-chrome-l">Internal memo</div>
      <div id="f02-chrome-r">Eyes only</div>
    </div>

    <div id="f02-field">
      <div id="f02-band"></div>
      <div id="f02-band-top"></div>
      <div id="f02-band-bot"></div>

      <div id="f02-kicker">
        <span id="f02-spike">&#10035;</span><span>Failure mode</span>
      </div>

      <div id="f02-redaction"></div>
      <div id="f02-caret-bar"></div>

      <div id="f02-type-line">
        <div id="f02-type-wrap">
          <span id="f02-type-text"></span><span id="f02-caret-type"></span>
        </div>
      </div>

      <div id="f02-rail"></div>
      <div id="f02-rail-idx"></div>

      <div id="f02-hero-line">
        <div id="f02-hero-wrap">
          <span id="f02-hero-text"></span><span id="f02-caret-hero"></span>
        </div>
      </div>

      <svg id="f02-rule-svg" viewBox="0 0 1180 1" preserveAspectRatio="none" aria-hidden="true">
        <line id="f02-rule-line" x1="0" y1="0.5" x2="1180" y2="0.5" />
      </svg>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DURATION = 4.64;
      var tl = gsap.timeline({ paused: true });

      /* ---------- housekeeping ---------- */
      // No CSS transforms are authored on any GSAP-animated element.

      var ruleLine = document.getElementById("f02-rule-line");
      var ruleLen = 1180; // straight horizontal <line> — measured geometry, no guessing
      ruleLine.style.strokeDasharray = ruleLen;
      ruleLine.style.strokeDashoffset = ruleLen;

      /* ---------- typewriter state ----------
         discrete-text-sequence: a sparse { t, text, seg } array, reverse-searched
         on every frame. context-sensitive-cursor: the caret's background follows
         the active segment (dim while transcribing the field label, solid on the
         value). The hero line types in EB Garamond with a longer word-break pause. */

      function buildSeq(str, start, perChar, spacePause) {
        var seq = [{ t: start, text: "", seg: "key" }];
        var t = start;
        for (var i = 0; i < str.length; i++) {
          var ch = str.charAt(i);
          t += perChar + (ch === " " ? spacePause : 0);
          seq.push({ t: t, text: str.slice(0, i + 1), seg: str.charAt(i + 1) === ":" ? "key" : "value" });
        }
        return seq;
      }

      var MONO_LINE = "CONTEXT HELD: ONE SESSION";
      var HERO_LINE = "Chapter 4";
      var SEQ_MONO = buildSeq(MONO_LINE, 1.061, 0.033, 0.133); // ends 3.45
      var SEQ_HERO = buildSeq(HERO_LINE, 3.447, 0.056, 0.199); // ends 4.4

      function entryAt(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) {
          if (time >= seq[i].t) return seq[i];
        }
        return seq[0];
      }

      var INK = "#141413";
      var INK_DIM = "rgba(20,20,19,0.45)";

      var typeText = document.getElementById("f02-type-text");
      var caretType = document.getElementById("f02-caret-type");
      var heroText = document.getElementById("f02-hero-text");
      var caretHero = document.getElementById("f02-caret-hero");
      var caretBar = document.getElementById("f02-caret-bar");

      var MONO_END = SEQ_MONO[SEQ_MONO.length - 1].t;
      var BAR_HANDOFF_START = 1.55;
      var BAR_HANDOFF_DUR = 0.22;

      // Blink is a deterministic square wave over a WHOLE number of cycles
      // (10 cycles / 7s = 0.70s period). Every gate below is a pure function of
      // driver time, so scrubbing backwards reproduces the frame exactly.
      var BLINK_CYCLES = 10;

      function blinkOn(p) {
        return Math.sin(p) > 0 ? 1 : 0;
      }

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            var t = driver.t;

            // --- Scene 2 · mono line types under the bar ---
            var m = entryAt(SEQ_MONO, t);
            typeText.textContent = t >= 1.061 ? m.text : "";
            caretType.style.background = m.seg === "key" ? INK_DIM : INK;
            // solid while keystrokes are landing, blinking on the pauses; off after the caret stops
            var typingMono = t >= 1.6 && t <= MONO_END;
            caretType.style.opacity =
              t >= 1.6 && t < 3.62 ? (typingMono ? 1 : blinkOn((t / 0.7) * Math.PI * 2)) : 0;

            // --- Scene 1 · caret parked at the redaction bar's left edge, then
            //     hands off down to the typing line (fades across the handoff) ---
            var barFade = 1;
            if (t >= BAR_HANDOFF_START) {
              barFade = Math.max(
                0,
                1 - (t - BAR_HANDOFF_START) / BAR_HANDOFF_DUR
              );
            }
            caretBar.style.opacity =
              t >= 0.62 && t < BAR_HANDOFF_START + BAR_HANDOFF_DUR
                ? blinkOn((t / 0.7) * Math.PI * 2) * barFade
                : 0;

            // --- Scene 4 · hero types, then the caret stops dead (solid, then out) ---
            var h = entryAt(SEQ_HERO, t);
            heroText.textContent = t >= 3.447 ? h.text : "";
            caretHero.style.background = INK;
            // solid from the first keystroke, then it simply STOPS DEAD at 4.4 —
            // no blink on the hero caret: the flatline is the point.
            caretHero.style.opacity = t >= 3.447 && t < 4.4 ? 1 : 0;
          },
        },0);

      /* ---------- Scene 1 (0.0-1.1s) · the memo scrolls to a new field ---------- */

      // The field band slides down into place (the memo being scrolled).
      tl.fromTo(
        "#f02-field",
        { y: -150, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },0);
      tl.fromTo(
        "#f02-chrome",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },0.033);

      // Kicker sets at the upper-left.
      tl.fromTo(
        "#f02-kicker",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },0.119);

      // The solid redaction bar wipes over the unseen line.
      tl.fromTo(
        "#f02-redaction",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out", transformOrigin: "left center" },0.278);
      // svg-path-draw: the right-margin rail traces in, hairline, power2.out
      tl.fromTo(
        "#f02-rail",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.45, ease: "power2.out", transformOrigin: "center top" },0.597);

      // The caret hands off from the bar down to the typing line. Only `y` is tweened
      // here — the fade across the handoff is owned by the typewriter driver, which
      // rewrites this element's opacity every frame.
      tl.fromTo(
        "#f02-caret-bar",
        { y: 0 },
        { y: 104, duration: 0.22, ease: "power2.in" },1.027);

      /* ---------- Scene 2 (1.1-2.4s) · the line types; the coral index mark sets ---------- */
      tl.fromTo(
        "#f02-rail-idx",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.28, ease: "power3.out", transformOrigin: "center top" },1.293);

      /* ---------- Scene 3 (2.4-3.4s) · "flatlines" · the line collapses away ----------
         scale-swap-transition's collapse half, at text-scale blur: the assembly
         rushes down and out of the focal plane, leaving the bar and empty space. */
      tl.fromTo(
        "#f02-type-line",
        { scale: 1, filter: "blur(0px)", opacity: 1 },
        { scale: 0.84, filter: "blur(10px)", opacity: 0, duration: 0.42, ease: "power3.in", transformOrigin: "left center" },2.4);

      /* ---------- Scene 4 (3.4-4.6s) · the hero types, the rule dies mid-stroke ---------- */
      // (the hero text itself is driven by the typewriter above)

      // svg-path-draw at constant pen rate — draws to ~60% and STOPS DEAD.
      tl.fromTo(
        "#f02-rule-line",
        { strokeDashoffset: ruleLen },
        { strokeDashoffset: ruleLen - ruleLen * 0.6, duration: 0.55, ease: "none" },4.209);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-failure-mode"] = tl;
      tl.seek(0);
    })();
  </script>
</template>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var ID = "03-thirty-services";

      var COUNT_START = 2.0;
      var COUNT_DUR = 3.2;
      var COUNT_EASE = "power3.out";
      var START_SCALE = 0.5;
      var BAR_W = 1760;
      var TARGET = 30;

      var tl = gsap.timeline({ paused: true });

      // ---- deterministic pre-entrance state (a seek to t=0 renders this exactly) ----
      tl.set("#f3-bar", { clipPath: "inset(0% 0% 0% 0%)" },0);
      tl.set("#f3-edge", { x: 0 },0);
      tl.set("#f3-number", { opacity: 0, scale: START_SCALE, textContent: 0 },0);
      tl.set("#f3-label", { opacity: 0, y: 12 },0);
      tl.set("#f3-rule", { scaleX: 0 },0);
      tl.set("#f3-rail-1", { clipPath: "inset(0 100% 0 0)" },0);
      tl.set("#f3-rail-2", { opacity: 0 },0);
      tl.set("#f3-rail-3", { clipPath: "inset(0 100% 0 0)" },0);
      tl.set("#f3-protocol", { opacity: 0, y: 10 },0);
      tl.set("#f3-kicker", { opacity: 0, y: -8 },0);
      tl.set("#f3-folio", { opacity: 0, y: -8 },0);
      tl.set("#f3-toprule", { scaleX: 0 },0);
      tl.set("#f3-fieldlabel", { opacity: 0, x: -14 },0);
      tl.set("#f3-value", { opacity: 0 },0);
      tl.set("#f3-bar", { opacity: 0, scaleY: 0.6 },0);

      // ---- Scene 1 (0.0-2.0): the memo field, value under a solid redaction bar ----
      tl.fromTo(
        "#f3-kicker",
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.05,
      );
      tl.fromTo(
        "#f3-folio",
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.1,
      );
      tl.fromTo(
        "#f3-toprule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power2.out" },
        0.15,
      );
      tl.fromTo(
        "#f3-fieldlabel",
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power2.out" },
        0.35,
      );
      tl.fromTo("#f3-value", { opacity: 0 }, { opacity: 1, duration: 0.5 },0.413);
      tl.fromTo(
        "#f3-bar",
        { opacity: 0, scaleY: 0.6 },
        { opacity: 1, scaleY: 1, duration: 0.6, ease: "power2.out" },
        0.2,
      );

      // ---- Scene 2 (2.0-3.4): the redaction-bar clip-path wipe, left to right ----
      // the coral leading edge rides the exact clip boundary: same duration, same ease
      tl.fromTo(
        "#f3-bar",
        { clipPath: "inset(0% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 100%)", duration: 1.35, ease: "power2.inOut" },
        2.0,
      );
      tl.fromTo("#f3-edge", { x: 0 }, { x: BAR_W, duration: 1.35, ease: "power2.inOut" },1.653);

      // ---- the count starts underneath the wipe (Scene 2 tail) ----
      // The digits tween as a real tweened property (textContent + snap), NOT an
      // onUpdate proxy: GSAP suppresses callbacks on seek(), so a proxy counter
      // renders a stale value at an arbitrary timestamp. This form is seek-exact
      // in both directions. tabular-nums in CSS keeps digit width stable.
      tl.fromTo(
        "#f3-number",
        { textContent: 0 },
        {
          textContent: TARGET,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          snap: { textContent: 1 },
        },
        COUNT_START,
      );
      tl.fromTo(
        "#f3-number",
        { opacity: 0, scale: START_SCALE },
        { opacity: 1, scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_START,
      );

      // ---- Scene 3 (3.4-5.6): label sets beneath, long-tail ease, restrained settle ----
      tl.fromTo(
        "#f3-label",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        4.0,
      );
      tl.to("#f3-number", { scale: 1.012, duration: 0.14, ease: "power1.out" },4.297);
      tl.to("#f3-number", { scale: 1, duration: 0.44, ease: "power2.out" },4.413);

      // ---- Scene 4 (5.6-8.0): the mono rail types on in segments, then the protocol line ----
      tl.fromTo(
        "#f3-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.65, ease: "power2.out" },
        5.75,
      );
      tl.fromTo(
        "#f3-rail-1",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power2.out" },
        5.9,

        { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.out" },
        6.6,

      tl.fromTo(
        "#f3-protocol",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        7.15,
      );

      window.__timelines[ID] = tl;
      tl.seek(0);
    })();
  </script>

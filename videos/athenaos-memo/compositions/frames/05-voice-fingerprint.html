  </style>

        <div class="vfp05-line"><span id="f05-voice-fingerprint-tx-9" class="vfp05-tx"></span><span id="f05-voice-fingerprint-caret-9" class="vfp05-caret"></span></div>

  <script>
    (function () {
      var DURATION = 10;
      var T_SETTLE = 7.0; /* Scene 4 — the held breather */
      var T_STRIP = 6.7; /* the strip lands on the voice's "stripping" */

      /* The specimen — a voice fingerprint is a sample of the writer's prose.
         Twelve discrete states; each line types at its own t (accelerating), and
         the blank lines are the writer's pauses. */
      var LINES = [
        "He kept the letter in his coat pocket for eleven days,",
        "not to send it, but to keep the paper near his chest",
        "and let it warm. The stamp had come loose by then, a",
        "small grey thing gone quiet in the crease, and he read",
        "the address four times without once meaning to leave.",
        "",
        "In the garden the light came in sideways, the way it",
        "does when there is a wall worth leaning on. She had cut",
        "the hedge in June and not thought about it since, so the",
        "yew had gone back to its own opinions.",
        "",
        "That is the whole of it: a man, a letter, a hedge.",
      ];
      var LINE_T = [1.6, 1.95, 2.27, 2.57, 2.86, 3.2, 3.58, 3.85, 4.11, 4.35, 4.58, 4.62];
      var LINE_D = [0.32, 0.29, 0.27, 0.26, 0.25, 0.001, 0.24, 0.23, 0.22, 0.2, 0.001, 0.22];
      var PAUSE_LINES = [5, 10];

      var T_FIRST = LINE_T[0];
      var T_DONE = 4.9; /* block complete; the caret settles and stops blinking */
      var TICK_TRAVEL = 558;

      var CORAL = "#cc785c";
      var DIM = "rgba(20, 20, 19, 0.22)";

      var $ = function (id) {
        return document.getElementById(id);
      };

      var spans = [];
      var carets = [];
      for (var i = 0; i < LINES.length; i++) {
        spans.push($("f05-voice-fingerprint-tx-" + i));
        carets.push($("f05-voice-fingerprint-caret-" + i));
      }

      /* Ids here begin with a digit, which is NOT a valid CSS selector — so every
         tween takes an element reference resolved by getElementById, never a
         selector string. */
      var el = {
        slab: $("f05-voice-fingerprint-slab"),
        kicker: $("f05-voice-fingerprint-kicker"),
        rule: $("f05-voice-fingerprint-rule"),
        display: $("f05-voice-fingerprint-display"),
        index: $("f05-voice-fingerprint-index"),
        railWords: $("f05-voice-fingerprint-rail-words"),
        railSpec: $("f05-voice-fingerprint-rail-spec"),
        tickRail: $("f05-voice-fingerprint-tick-rail"),
        tickBar: $("f05-voice-fingerprint-tick-bar"),
        tickHead: $("f05-voice-fingerprint-tick-head"),
        strip: $("f05-voice-fingerprint-strip"),
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0.0–1.6) — chrome sets, caret blinks on an empty block ── */
      tl.fromTo(el.slab, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0);
      tl.fromTo(el.kicker, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.42, ease: "power2.out" }, 0.1);
      tl.fromTo(el.rule, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 0.34);
      tl.fromTo(el.display, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.55);
      tl.fromTo(el.railWords, { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.45);
      tl.fromTo(el.railSpec, { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.5);
      tl.fromTo(el.tickRail, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.5);
      tl.fromTo(el.index, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.95);

      /* ── Scene 2 (1.6–4.9) — the block types, the coral tick rides down ──
            The typed text is a discrete per-character schedule: every character is
            its own inline span, revealed by a plain opacity tween. Two hard engine
            constraints force this shape, and both were verified against this
            project's GSAP build:
              · the renderer seeks frame by frame, and GSAP does NOT fire onUpdate on
                a seek — so ANY callback that writes text (the rule recipe's proxy-
                driver pattern) renders every seeked frame blank or stale;
              · a zero-duration tl.set() is not a substitute: it has no baked start
                value, so scrubbing backward restores whatever the previous frame
                left rather than the correct earlier text.
            A real tween has a baked from-value, so forward play and reverse scrub
            land on identical frames. Characters are spaced across each line's
            duration, which is what makes the run read as keystrokes rather than a
            bulk paste, and it is the packet's line-by-line setting made literal. */
      LINES.forEach(function (line, i) {
        var host = spans[i];
        host.textContent = "";
        if (line.length === 0) return;
        var step = Math.max(LINE_D[i], 0.001) / line.length;
        for (var c = 0; c < line.length; c++) {
          var ch = document.createElement("span");
          ch.className = "vfp05-ch";
          ch.textContent = line.charAt(c);
          host.appendChild(ch);
          /* duration 0 keeps the reveal a hard keystroke, but the tween (not a set)
             is what makes the pre-reveal state baked and therefore seek-exact */
          tl.fromTo(ch, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, LINE_T[i] + step * c);
        }
      });

      tl.fromTo(el.tickBar, { scaleY: 0 }, { scaleY: 1, duration: T_DONE - T_FIRST, ease: "none" }, T_FIRST);
      tl.fromTo(
        el.tickHead,
        { y: 0 },
        { y: TICK_TRAVEL, duration: T_DONE - T_FIRST, ease: "none" },
        T_FIRST,
      );

      /* ── Scene 3 (4.6–7.0) — the strip sets on the voice's "stripping" ── */
      tl.fromTo(el.strip, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, T_STRIP);

      /* ── the caret: context-sensitive color + blink.
            Same rule as the text — every caret state is a tl.set at a baked time,
            so a seek to any t restores the exact caret (which line owns it, its
            color, and whether it is mid-blink) with no callback involved. The
            schedule is generated once here from a pure function of time, so it is
            identical on a forward render or a scrub back through it. ── */
      var BLINK_HALF = 0.31; /* ~0.62s period, inside the rule's 0.6–1.2s band */
      var LAST = LINES.length - 1;

      function caretOwner(t) {
        if (t >= T_DONE) return LAST;
        for (var i = LINE_T.length - 1; i >= 0; i--) if (t >= LINE_T[i]) return i;
        return 0; /* before the first keystroke: parked at the block's start */
      }

      /* Baseline: every caret dark, nothing blinking yet. */
      carets.forEach(function (c) {
        tl.set(c, { opacity: 0, background: CORAL }, 0);
      });

      /* One owner at a time: at each line's start, hand the caret over explicitly —
         light the new owner in its CURRENT blink phase and dark the one it replaces,
         so carets never stack and the handoff is never a dark gap. */
      function blinkOn(t) {
        return Math.floor(t / BLINK_HALF) % 2 === 0;
      }
      LINE_T.forEach(function (t0, i) {
        var tint = PAUSE_LINES.indexOf(i) === -1 ? CORAL : DIM;
        if (i > 0) tl.set(carets[i - 1], { opacity: 0 }, t0);
        tl.set(carets[i], { opacity: blinkOn(t0) ? 1 : 0, background: tint }, t0);
      });

      /* Blink only while the block is live: a square wave stepped on the timeline.
         It stops dead at T_DONE — the caret settles and stops blinking (Scene 3). */
      var t = 0;
      var on = true;
      while (t < T_DONE) {
        var owner = caretOwner(t);
        tl.set(carets[owner], { opacity: on ? 1 : 0 }, t);
        /* re-assert the owner on every toggle so a hand-off mid-cycle is exact */
        tl.set(carets[owner], { background: PAUSE_LINES.indexOf(owner) === -1 ? CORAL : DIM }, t);
        t += BLINK_HALF;
        on = !on;
      }
      /* settled: solid, at the last line, for the whole breather */
      tl.set(carets[LAST], { opacity: 1, background: CORAL }, T_DONE);

      /* ── Scene 4 (7.0–10.0) — the breather. No drift, no breathing: at most a
            faint jitter in the settled caret, stepped on the timeline so it too is
            seek-exact. The caret carries no CSS transform, so this x is safe to own. ── */
      var JITTER_STEP = 0.42;
      for (var jt = T_SETTLE; jt < DURATION; jt += JITTER_STEP) {
        tl.set(carets[LAST], { x: Math.sin(jt * 9.1) * 1.2 }, jt);
      }

      /* full-span anchor so the sub-composition timeline spans the whole frame */
      tl.to({}, { duration: DURATION }, 0);

      window.__timelines["05-voice-fingerprint"] = tl;
    })();
  </script>
